<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F7A87" />
  <title>Offline — AetherDev Solutions</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #f8fafc; color: #1f2937; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 20px; box-shadow: 0 4px 16px rgba(15, 122, 135, 0.15); }
    h1 { font-size: 20px; margin: 20px 0 6px; }
    p { font-size: 14px; color: #6b7280; margin: 0 0 20px; max-width: 320px; line-height: 1.5; }
    button { background: #0F7A87; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>AetherDev needs an internet connection. Check your mobile data or Wi-Fi and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
